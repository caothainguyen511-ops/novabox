name: NovaBox Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout NovaBox
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
      - name: Run NovaBox offline overlay tests
        run: |
          python3 tests/test_files.py
          bash -n scripts/bootstrap.sh scripts/build-local.sh
          python3 -m py_compile scripts/apply_branding.py scripts/layout_overlay.py
      - name: Bootstrap pinned Winlator engine and apply NovaBox UI
        run: bash ./scripts/bootstrap.sh
      - name: Build APK
        working-directory: vendor/winlator/app
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:assembleDebug
      - name: Copy APK
        run: |
          mkdir -p dist
          cp vendor/winlator/app/app/build/outputs/apk/debug/app-debug.apk dist/NovaBox-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaBox-Android-debug-apk
          path: dist/NovaBox-debug.apk
          if-no-files-found: error
